services:
  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}qdrant
    restart: unless-stopped
    environment:
      TZ: ${TIMEZONE:-UTC}
      # Every request to the API needs this key (header `api-key`); the dashboard asks for it.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
    - qdrant-storage:/qdrant/storage
    - qdrant-snapshots:/qdrant/snapshots
    ports:
    # 6333: REST API and dashboard (/dashboard); 6334: gRPC.
    - 127.0.0.1:${QDRANT_PORT}:6333
    - 127.0.0.1:${QDRANT_GRPC_PORT}:6334
    networks:
    - apps
    healthcheck:
      test:
      - CMD-SHELL
      - bash -c '</dev/tcp/localhost/6333'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
volumes:
  qdrant-storage:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/storage
      o: bind
  qdrant-snapshots:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/snapshots
      o: bind
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
