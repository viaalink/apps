services:
  erpnext-mariadb:
    image: mariadb:${ERPNEXT_MARIADB_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-mariadb
    restart: unless-stopped
    mem_limit: 384m
    command:
    - --character-set-server=utf8mb4
    - --collation-server=utf8mb4_unicode_ci
    - --skip-character-set-client-handshake
    - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${ERPNEXT_MARIADB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${ERPNEXT_MARIADB_DATABASE}
      MYSQL_USER: ${ERPNEXT_MARIADB_USER}
      MYSQL_PASSWORD: ${ERPNEXT_MARIADB_PASSWORD}
    volumes:
    - erpnext-mariadb:/var/lib/mysql
    networks:
    - apps
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      via.service: erpnext
      via.role: database
      via.tier: tier1
  erpnext-redis-cache:
    image: redis:${ERPNEXT_REDIS_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-redis-cache
    restart: unless-stopped
    mem_limit: 64m
    volumes:
    - erpnext-redis-cache:/data
    networks:
    - apps
    labels:
      via.service: erpnext
      via.role: cache
      via.tier: tier1
  erpnext-redis-queue:
    image: redis:${ERPNEXT_REDIS_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-redis-queue
    restart: unless-stopped
    mem_limit: 64m
    volumes:
    - erpnext-redis-queue:/data
    networks:
    - apps
    labels:
      via.service: erpnext
      via.role: queue
      via.tier: tier1
  # A one-off container: ERPNext's folders must belong to the user ERPNext runs as.
  # Folders made by an install done as root belong to root, and ERPNext then cannot write its site.
  erpnext-init:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-init
    restart: "no"
    user: root
    network_mode: none
    entrypoint:
    - bash
    - -c
    - chown 1000:1000 /home/frappe/frappe-bench/sites /home/frappe/frappe-bench/logs
    volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs
  # A one-off container at every start: writes where the database and the queues are, then
  # makes the site with its administrator (first start) or brings the database to the
  # version that now runs (every later start).
  erpnext-configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-configurator
    restart: 'no'
    mem_limit: 512m
    entrypoint:
    - bash
    - -c
    command:
    - |
      set -e
      ls -1 apps > sites/apps.txt
      bench set-config -g db_host $$DB_HOST
      bench set-config -gp db_port $$DB_PORT
      bench set-config -g redis_cache "redis://$$REDIS_CACHE"
      bench set-config -g redis_queue "redis://$$REDIS_QUEUE"
      bench set-config -g redis_socketio "redis://$$REDIS_QUEUE"
      bench set-config -gp socketio_port $$SOCKETIO_PORT
      if [ ! -f sites/$$SITE_NAME/site_config.json ]; then
        echo "Creating new site..."
        bench new-site --no-mariadb-socket --admin-password=$$ADMIN_PASSWORD --db-root-password=$$DB_ROOT_PASSWORD --install-app erpnext --set-default $$SITE_NAME
      else
        echo "Site already exists, running migrate..."
        bench --site $$SITE_NAME migrate
      fi
    environment: &erpnext-env
      SITE_NAME: ${ERPNEXT_SITE_NAME:-erpnext.localhost}
      SITES_PATH: .
      DB_HOST: ${CONTAINER_PREFIX:-}erpnext-mariadb
      DB_PORT: '3306'
      DB_ROOT_PASSWORD: ${ERPNEXT_MARIADB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ERPNEXT_ADMIN_PASSWORD}
      REDIS_CACHE: ${CONTAINER_PREFIX:-}erpnext-redis-cache:6379
      REDIS_QUEUE: ${CONTAINER_PREFIX:-}erpnext-redis-queue:6379
      SOCKETIO_PORT: '9000'
    volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs
    networks:
    - apps
    depends_on:
      erpnext-init:
        condition: service_completed_successfully
      erpnext-mariadb:
        condition: service_healthy
      erpnext-redis-cache:
        condition: service_started
      erpnext-redis-queue:
        condition: service_started
    labels:
      via.service: erpnext
      via.role: configurator
      via.tier: tier1
      via.category: erp
  erpnext-backend:
    # ERPNext's scripts and styles are in the image; each container links them into the
    # site folder when it starts (sites/assets), so they always fit the version that runs.
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-backend
    restart: unless-stopped
    mem_limit: 384m
    working_dir: /home/frappe/frappe-bench/sites
    command:
    - /home/frappe/frappe-bench/env/bin/gunicorn
    - -b
    - 0.0.0.0:8000
    - -w
    - '4'
    - -t
    - '120'
    - frappe.app:application
    - --preload
    - --chdir
    - /home/frappe/frappe-bench/sites
    environment: *erpnext-env
    volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs
    - erpnext-logs:/home/frappe/logs
    networks:
    - apps
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      via.service: erpnext
      via.role: backend
      via.tier: tier1
      via.category: erp
  # Live updates in the browser.
  erpnext-websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-websocket
    restart: unless-stopped
    mem_limit: 128m
    command:
    - node
    - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment: *erpnext-env
    volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs
    - erpnext-logs:/home/frappe/logs
    networks:
    - apps
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      via.service: erpnext
      via.role: websocket
      via.tier: tier1
      via.category: erp
  # Starts ERPNext's scheduled jobs.
  erpnext-scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-scheduler
    restart: unless-stopped
    mem_limit: 128m
    command:
    - bench
    - schedule
    environment: *erpnext-env
    volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs
    - erpnext-logs:/home/frappe/logs
    networks:
    - apps
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      via.service: erpnext
      via.role: scheduler
      via.tier: tier1
      via.category: erp
  # Works through the short background jobs.
  erpnext-worker-short:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-worker-short
    restart: unless-stopped
    mem_limit: 128m
    command:
    - bench
    - worker
    - --queue
    - short,default
    environment: *erpnext-env
    volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs
    - erpnext-logs:/home/frappe/logs
    networks:
    - apps
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      via.service: erpnext
      via.role: worker-short
      via.tier: tier1
      via.category: erp
  # Works through the long background jobs.
  erpnext-worker-long:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext-worker-long
    restart: unless-stopped
    mem_limit: 128m
    command:
    - bench
    - worker
    - --queue
    - long
    environment: *erpnext-env
    volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs
    - erpnext-logs:/home/frappe/logs
    networks:
    - apps
    depends_on:
      erpnext-configurator:
        condition: service_completed_successfully
    labels:
      via.service: erpnext
      via.role: worker-long
      via.tier: tier1
      via.category: erp
  # The web server in front: this is the address of ERPNext.
  erpnext-frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}erpnext
    restart: unless-stopped
    mem_limit: 128m
    command:
    - nginx-entrypoint.sh
    ports:
    - ${ERPNEXT_PORT}:8080
    environment:
      BACKEND: ${CONTAINER_PREFIX:-}erpnext-backend:8000
      SOCKETIO: ${CONTAINER_PREFIX:-}erpnext-websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${ERPNEXT_SITE_NAME:-erpnext.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: 'off'
      PROXY_READ_TIMEOUT: '120'
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
    - erpnext-sites:/home/frappe/frappe-bench/sites
    - erpnext-logs:/home/frappe/frappe-bench/logs
    networks:
    - apps
    depends_on:
    - erpnext-backend
    - erpnext-websocket
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/api/method/ping
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      via.service: erpnext
      via.role: main
      via.tier: tier1
      via.category: erp
volumes:
  erpnext-sites:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/sites
      o: bind
  erpnext-logs:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/logs
      o: bind
  erpnext-mariadb:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/mariadb
      o: bind
  erpnext-redis-cache:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/redis-cache
      o: bind
  erpnext-redis-queue:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/redis-queue
      o: bind
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
