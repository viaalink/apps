id: "${{ macro.concat('env:ENV_PREFIX', 'n8n') }}"
name: N8N
seedDefaultRegistry: true
endpoint:
  url: "http://127.0.0.1:${{ env.N8N_PORT }}"
caddy:
  publishPreferred: true
  hostRoute:
    host: "${{ macro.hostname('env:N8N_URL') }}"
  responseHeaders:
    Cache-Control: ["no-store, no-cache, must-revalidate, proxy-revalidate"]
    Pragma: ["no-cache"]
    Expires: ["0"]
  # authPolicy: pma-users
  # authBypassPaths: ["/webhook/*", "/webhook-test/*", "/rest/oidc/login", "/rest/oidc/callback"]
tunnel:
  public: true
  protocol: http
  # The name n8n is published under; the domain is the project's, else the relay's own.
  subdomain: n8n
  port: "${{ env.ASD_CADDY_PORT_HTTP }}"
env:
  N8N_URL: "${{ macro.exposedOrigin() }}"
  N8N_OIDC_REDIRECT_URI: "${{ macro.exposedOrigin() }}/rest/oidc/callback"
  N8N_OIDC_PUBLIC_ISSUER: "${{ env.AUTHENTIK_URL }}/application/o/n8n/"
labels:
  source: package
  priority: "100"
