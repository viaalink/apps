services:
  excalidraw:
    # Upstream publishes this image as `latest` only, so EXCALIDRAW_VERSION is the digest of
    # one build (2026-05-06). Live collaboration and share links go through excalidraw.com.
    image: excalidraw/excalidraw@${EXCALIDRAW_VERSION}
    container_name: ${CONTAINER_PREFIX:-}excalidraw
    restart: unless-stopped
    mem_limit: 128m
    environment:
      TZ: ${TIMEZONE:-UTC}
    ports:
    - 127.0.0.1:${EXCALIDRAW_PORT}:80
    networks:
    - apps
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:80/ || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
