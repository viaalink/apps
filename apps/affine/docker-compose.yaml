services:
  affine:
    image: ghcr.io/toeverything/affine:${AFFINE_VERSION}
    container_name: ${CONTAINER_PREFIX:-}affine
    restart: unless-stopped
    ports:
      - ${AFFINE_PORT}:3010
    environment:
      AFFINE_CONFIG_PATH: /root/.affine/config
      NODE_ENV: production
      # Its published address; without one, this machine.
      AFFINE_SERVER_EXTERNAL_URL: ${AFFINE_URL:-http://localhost:${AFFINE_PORT}}
      REDIS_SERVER_HOST: ${CONTAINER_PREFIX:-}affine-redis
      DATABASE_URL: postgresql://${AFFINE_POSTGRES_USER}:${AFFINE_POSTGRES_PASSWORD}@${CONTAINER_PREFIX:-}affine-postgres:5432/${AFFINE_POSTGRES_DB}
      MAILER_HOST: ${AFFINE_MAILER_HOST:-}
      MAILER_PORT: ${AFFINE_MAILER_PORT:-}
      MAILER_USER: ${AFFINE_MAILER_USER:-}
      MAILER_PASSWORD: ${AFFINE_MAILER_PASSWORD:-}
      MAILER_SENDER: ${AFFINE_MAILER_SENDER:-}
    # Without a published address Authentik is reached as authentik.localhost: the browser
    # resolves that to this machine, the container through this entry.
    extra_hosts:
      - authentik.localhost:host-gateway
    volumes:
      - affine-config:/root/.affine/config
      - affine-storage:/root/.affine/storage
    networks:
      - apps
    depends_on:
      affine-migration:
        condition: service_completed_successfully
      affine-redis:
        condition: service_healthy
      affine-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); const req = http.get('http://localhost:3010/info', (res) => { process.exit(res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.setTimeout(5000, () => { req.destroy(); process.exit(1); });\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      via.service: affine
      via.role: main
      via.tier: tier2
      via.category: documentation

  affine-migration:
    image: ghcr.io/toeverything/affine:${AFFINE_VERSION}
    container_name: ${CONTAINER_PREFIX:-}affine-migration
    restart: "no"
    environment:
      AFFINE_CONFIG_PATH: /root/.affine/config
      NODE_ENV: production
      DATABASE_URL: postgresql://${AFFINE_POSTGRES_USER}:${AFFINE_POSTGRES_PASSWORD}@${CONTAINER_PREFIX:-}affine-postgres:5432/${AFFINE_POSTGRES_DB}
      REDIS_SERVER_HOST: ${CONTAINER_PREFIX:-}affine-redis
    command: ["node", "./scripts/self-host-predeploy.js"]
    volumes:
      - affine-config:/root/.affine/config
      - affine-storage:/root/.affine/storage
    networks:
      - apps
    depends_on:
      affine-redis:
        condition: service_healthy
      affine-postgres:
        condition: service_healthy
    labels:
      via.service: affine
      via.role: worker
      via.tier: tier2
      via.category: documentation

  affine-redis:
    image: redis:${AFFINE_REDIS_VERSION}
    container_name: ${CONTAINER_PREFIX:-}affine-redis
    restart: unless-stopped
    volumes:
      - affine-redis-data:/data
    networks:
      - apps
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      via.service: affine
      via.role: cache
      via.tier: tier2
      via.category: documentation

  affine-postgres:
    image: pgvector/pgvector:${AFFINE_POSTGRES_VERSION}
    container_name: ${CONTAINER_PREFIX:-}affine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AFFINE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AFFINE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AFFINE_POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - affine-postgres-data:/var/lib/postgresql/data/pgdata
    networks:
      - apps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AFFINE_POSTGRES_USER} -d ${AFFINE_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      via.service: affine
      via.role: database
      via.tier: tier2
      via.category: documentation

volumes:
  affine-config:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/config
      o: bind
  affine-storage:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/storage
      o: bind
  affine-redis-data:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/redis
      o: bind
  affine-postgres-data:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/postgres
      o: bind

networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
