services:
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    container_name: ${CONTAINER_PREFIX:-}mailpit
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TIMEZONE:-UTC}
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "5000"
      # The web inbox and its API ask for this login.
      MP_UI_AUTH: ${MAILPIT_UI_USER}:${MAILPIT_UI_PASSWORD}
      # Mail is taken from any sender without a login: catching whatever an app sends is
      # what Mailpit is for. The SMTP port is open to this machine and to the other apps
      # of the project only (${CONTAINER_PREFIX:-}mailpit:1025).
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
    - mailpit-data:/data
    ports:
    - 127.0.0.1:${MAILPIT_PORT}:8025
    - 127.0.0.1:${MAILPIT_SMTP_PORT}:1025
    networks:
    - apps
    healthcheck:
      test:
      - CMD
      - /mailpit
      - readyz
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
volumes:
  mailpit-data:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/data
      o: bind
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
