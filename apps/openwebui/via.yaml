version: 1
network:
  services:
    openwebui:
      name: OpenWebUI
      dial: "127.0.0.1:${{ env.OPENWEBUI_PORT }}"
      host: "${{ macro.hostname('env:OPENWEBUI_URL') }}"
      responseHeaders:
        Cache-Control: ["no-store, no-cache, must-revalidate, proxy-revalidate"]
        Pragma: ["no-cache"]
        Expires: ["0"]
      # authPolicy: users
      # authBypassPaths: ["/oauth/oidc/callback"]
      public: true
      subdomain: openwebui
      env:
        OPENWEBUI_URL: "${{ macro.exposedOrigin() }}"
        OPENWEBUI_OIDC_PROVIDER_URL: "${{ env.AUTHENTIK_URL }}/application/o/openwebui/.well-known/openid-configuration"
        OPENWEBUI_OIDC_REDIRECT_URI: "${{ macro.exposedOrigin() }}/oauth/oidc/callback"
      priority: 45
