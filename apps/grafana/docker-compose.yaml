services:
  # A one-off container: Grafana's data folder must belong to the user Grafana runs as.
  # A folder made by an install belongs to whoever installed, and Grafana then cannot start.
  grafana-init:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: ${CONTAINER_PREFIX:-}grafana-init
    restart: "no"
    user: root
    network_mode: none
    entrypoint:
    - sh
    - -c
    - chown 472:0 /var/lib/grafana
    volumes:
    - grafana-data:/var/lib/grafana
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: ${CONTAINER_PREFIX:-}grafana
    restart: unless-stopped
    user: '472'
    depends_on:
      grafana-init:
        condition: service_completed_successfully
    env_file:
    # Settings of your own (GF_... lines); empty unless you fill it.
    - ${VIA_APP_DATA_DIR}/extra.env
    environment:
    # The admin account, made at the first start with the password from .env.
    - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
    - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
    - GF_SERVER_ROOT_URL=${GRAFANA_URL:-http://localhost:${GRAFANA_PORT}}
    - GF_SERVER_SERVE_FROM_SUB_PATH=false
    - GF_ANALYTICS_REPORTING_ENABLED=false
    - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    # Nobody gets in without an account, and nobody makes one for themselves.
    - GF_AUTH_ANONYMOUS_ENABLED=false
    - GF_USERS_ALLOW_SIGN_UP=false
    # Sign-in through Authentik: on once the app's prepare step (scripts/connect-sign-in.ts)
    # made the client in the Authentik of this project. The browser goes to Authentik's own
    # address; Grafana itself asks Authentik's container directly.
    - GF_AUTH_GENERIC_OAUTH_ENABLED=${GRAFANA_OAUTH_ENABLED:-false}
    - GF_AUTH_GENERIC_OAUTH_NAME=Authentik
    - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OAUTH_CLIENT_ID:-}
    - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OAUTH_CLIENT_SECRET:-}
    - GF_AUTH_GENERIC_OAUTH_SCOPES=openid profile email
    - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${AUTHENTIK_URL:-${AUTHENTIK_LOCAL_URL:-}}/application/o/authorize/
    - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=http://${CONTAINER_PREFIX:-}authentik:9000/application/o/token/
    - GF_AUTH_GENERIC_OAUTH_API_URL=http://${CONTAINER_PREFIX:-}authentik:9000/application/o/userinfo/
    # Without this Grafana asks an address for the user's email that Authentik does not
    # have (/emails, as GitHub has it); the email is in the user info itself.
    - GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH=email
    - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=preferred_username
    - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=name
    # Whoever Authentik lets in gets an account at the first sign-in. Members of the Authentik
    # group "Grafana Admins" are administrators, of "Grafana Editors" editors, the rest viewers.
    - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
    - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=contains(groups[*], 'Grafana Admins')
      && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'
    - GF_AUTH_SIGNOUT_REDIRECT_URL=${GRAFANA_SIGNOUT_URL:-}
    # Grafana refuses a query from a browser whose address it does not know ("origin not
    # allowed", every panel then shows "No data"). The prepare step writes the published
    # host name here.
    - GF_SECURITY_CSRF_TRUSTED_ORIGINS=${GRAFANA_CSRF_TRUSTED_ORIGINS:-}
    ports:
    - ${GRAFANA_PORT}:3000
    volumes:
    - grafana-data:/var/lib/grafana
    - ${VIA_APP_DATA_DIR}/provisioning:/etc/grafana/provisioning:ro
    - ${VIA_APP_DATA_DIR}/dashboards:/var/lib/grafana/dashboards:ro
    networks:
    - apps
    healthcheck:
      test:
      - CMD-SHELL
      - curl -f http://localhost:3000/api/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      via.service: grafana
      via.role: main
      via.tier: tier2
volumes:
  grafana-data:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/data
      o: bind
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
