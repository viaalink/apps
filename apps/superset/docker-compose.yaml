services:
  asd-superset-postgres:
    image: postgres:${SUPERSET_POSTGRES_VERSION}
    container_name: ${CONTAINER_PREFIX:-}superset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SUPERSET_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SUPERSET_POSTGRES_DB}
    volumes:
    - superset-postgres:/var/lib/postgresql/data
    networks:
    - apps
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${SUPERSET_POSTGRES_USER}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      pma.service: superset
      pma.role: database
      pma.tier: tier2
      pma.category: analytics
  asd-superset-redis:
    image: redis:${SUPERSET_REDIS_VERSION}
    container_name: ${CONTAINER_PREFIX:-}superset-redis
    restart: unless-stopped
    volumes:
    - superset-redis:/data
    networks:
    - apps
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      pma.service: superset
      pma.role: cache
      pma.tier: tier2
      pma.category: analytics
  asd-superset:
    # The image is built from this package: upstream Superset plus the database
    # drivers and the single sign-on library (see docker/Dockerfile).
    build: &superset-build
      context: ./docker
      args:
        SUPERSET_BASE_VERSION: ${SUPERSET_BASE_VERSION:-6.0.0}
    image: asd-superset:${SUPERSET_VERSION}
    container_name: ${CONTAINER_PREFIX:-}superset
    restart: unless-stopped
    ports:
    - ${SUPERSET_PORT}:8088
    environment: &superset-env
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SQLALCHEMY_DATABASE_URI: postgresql://${SUPERSET_POSTGRES_USER}:${SUPERSET_POSTGRES_PASSWORD}@${CONTAINER_PREFIX:-}superset-postgres/${SUPERSET_POSTGRES_DB}
      REDIS_URL: redis://${CONTAINER_PREFIX:-}superset-redis:6379/0
      REDIS_HOST: ${CONTAINER_PREFIX:-}superset-redis
      CELERY_BROKER_URL: redis://${CONTAINER_PREFIX:-}superset-redis:6379/1
      CELERY_RESULT_BACKEND: redis://${CONTAINER_PREFIX:-}superset-redis:6379/2
      CONTAINER_PREFIX: ${CONTAINER_PREFIX:-}
      ENV_PREFIX: ${ENV_PREFIX:-dev-}
      ASD_CLIENT_ID: ${ASD_CLIENT_ID:-}
      ASD_TUNNEL_HOST: ${ASD_TUNNEL_HOST:-}
      AUTHENTIK_CONTAINER: ${CONTAINER_PREFIX:-}authentik
      ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME}
      ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      SUPERSET_FEATURE_ENABLE_TEMPLATE_PROCESSING: 'true'
      ENABLE_PROXY_FIX: 'true'
      SUPERSET_FEATURE_SQLLAB_BACKEND_PERSISTENCE: 'false'
      SUPERSET_OAUTH_CLIENT_ID: ${SUPERSET_OAUTH_CLIENT_ID:-}
      SUPERSET_OAUTH_CLIENT_SECRET: ${SUPERSET_OAUTH_CLIENT_SECRET:-}
      # Authentik's published address; without one, its local address (written by the prepare step).
      AUTHENTIK_URL: ${AUTHENTIK_URL:-${AUTHENTIK_LOCAL_URL:-}}
      SUPERSET_URL: ${SUPERSET_URL:-http://localhost:8088}
      TZ: ${TIMEZONE:-UTC}
    volumes: &superset-volumes
    - superset-home:/app/superset_home
    - ${VIA_APP_DATA_DIR}/config/superset_config.py:/app/superset_config.py:ro
    networks:
    - apps
    depends_on:
      asd-superset-postgres:
        condition: service_healthy
      asd-superset-redis:
        condition: service_healthy
      # Database migrations and the first admin account, on every start.
      asd-superset-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8088/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      pma.service: superset
      pma.role: main
      pma.tier: tier2
      pma.category: analytics
  asd-superset-init:
    build: *superset-build
    image: asd-superset:${SUPERSET_VERSION}
    container_name: ${CONTAINER_PREFIX:-}superset-init
    command:
    - /bin/bash
    - -c
    - |
      superset db upgrade &&
      superset fab create-admin \
        --username "$${ADMIN_USERNAME}" \
        --firstname Admin \
        --lastname User \
        --email "$${ADMIN_EMAIL}" \
        --password "$${ADMIN_PASSWORD}" || true &&
      superset init
    environment: *superset-env
    volumes: *superset-volumes
    networks:
    - apps
    depends_on:
      asd-superset-postgres:
        condition: service_healthy
      asd-superset-redis:
        condition: service_healthy
    restart: 'no'
    labels:
      pma.service: superset
      pma.role: init
      pma.tier: tier2
      pma.category: analytics
  asd-superset-worker:
    build: *superset-build
    image: asd-superset:${SUPERSET_VERSION}
    container_name: ${CONTAINER_PREFIX:-}superset-worker
    restart: unless-stopped
    command: celery --app=superset.tasks.celery_app:app worker --pool=prefork -O fair
      -c 4 --max-tasks-per-child=100 --max-memory-per-child=300000
    environment: *superset-env
    volumes: *superset-volumes
    networks:
    - apps
    depends_on:
    - asd-superset
    healthcheck:
      test:
      - CMD-SHELL
      - celery --app=superset.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 60s
    labels:
      pma.service: superset
      pma.role: worker
      pma.tier: tier2
      pma.category: analytics
  asd-superset-beat:
    build: *superset-build
    image: asd-superset:${SUPERSET_VERSION}
    container_name: ${CONTAINER_PREFIX:-}superset-beat
    restart: unless-stopped
    command: celery --app=superset.tasks.celery_app:app beat --pidfile /tmp/celerybeat.pid
      --schedule=/tmp/celerybeat-schedule
    environment: *superset-env
    volumes: *superset-volumes
    networks:
    - apps
    depends_on:
    - asd-superset
    healthcheck:
      test:
      - CMD-SHELL
      - test -f /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      pma.service: superset
      pma.role: beat
      pma.tier: tier2
      pma.category: analytics
volumes:
  superset-home:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/home
      o: bind
  superset-postgres:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/postgres
      o: bind
  superset-redis:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/redis
      o: bind
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
