id: "${{ macro.concat('env:ENV_PREFIX', 'superset') }}"
name: Superset
seedDefaultRegistry: true
endpoint:
  url: "http://127.0.0.1:${{ env.SUPERSET_PORT }}"
caddy:
  publishPreferred: true
  hostRoute:
    host: "${{ macro.hostname('env:SUPERSET_URL') }}"
  responseHeaders:
    Cache-Control: ["no-store, no-cache, must-revalidate, proxy-revalidate"]
    Pragma: ["no-cache"]
    Expires: ["0"]
  # authPolicy: pma-users
  # authBypassPaths: ["/oauth-authorized/authentik", "/health"]
tunnel:
  public: true
  protocol: http
  port: "${{ env.ASD_CADDY_PORT_HTTP }}"
  subdomain: superset
env:
  SUPERSET_URL: "${{ macro.exposedOrigin() }}"
labels:
  source: package
  priority: "50"
