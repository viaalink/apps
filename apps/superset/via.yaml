version: 1
network:
  services:
    superset:
      name: Superset
      dial: "127.0.0.1:${{ env.SUPERSET_PORT }}"
      host: "${{ macro.hostname('env:SUPERSET_URL') }}"
      responseHeaders:
        Cache-Control: ["no-store, no-cache, must-revalidate, proxy-revalidate"]
        Pragma: ["no-cache"]
        Expires: ["0"]
      # authPolicy: users
      # authBypassPaths: ["/oauth-authorized/authentik", "/health"]
      public: true
      subdomain: superset
      env:
        SUPERSET_URL: "${{ macro.exposedOrigin() }}"
      priority: 50
