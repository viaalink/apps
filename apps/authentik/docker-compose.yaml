services:
  authentik-postgres:
    image: postgres:16-alpine
    container_name: ${CONTAINER_PREFIX:-}authentik-postgres
    restart: unless-stopped
    mem_limit: 384m
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS}
      POSTGRES_DB: authentik
    volumes:
    - authentik-postgres:/var/lib/postgresql/data
    networks:
    - apps
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -d authentik -U authentik
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    labels:
      via.service: authentik
      via.role: database
      via.tier: tier1
  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    container_name: ${CONTAINER_PREFIX:-}authentik
    command: server
    restart: unless-stopped
    mem_limit: 1g
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ${CONTAINER_PREFIX:-}authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD:-}
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_HOST: ${AUTHENTIK_HOST:-${AUTHENTIK_URL}}
      AUTHENTIK_HOST_BROWSER: ${AUTHENTIK_HOST_BROWSER:-${AUTHENTIK_URL}}
      AUTHENTIK_CSRF__TRUSTED_ORIGINS: ${AUTHENTIK_HOST_BROWSER:-${AUTHENTIK_URL}}
      AUTHENTIK_ALLOWED_REDIRECT_URIS: ${AUTHENTIK_HOST_BROWSER:-${AUTHENTIK_URL}}/*
      AUTHENTIK_LISTEN__TRUSTED_PROXY_CIDRS: 0.0.0.0/0
      AUTHENTIK_COOKIE__SECURE: 'true'
      AUTHENTIK_COOKIE__SAMESITE: none
      AUTHENTIK_CACHE__TIMEOUT_POLICIES: 60
    ports:
    - ${AUTHENTIK_PORT}:9000
    - ${AUTHENTIK_HTTPS_PORT}:9443
    volumes:
    - authentik-media:/media
    - authentik-templates:/templates
    networks:
    - apps
    depends_on:
      authentik-postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - /ak-root/.venv/bin/python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:9000/-/health/ready/',
        timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      via.service: authentik
      via.role: main
      via.tier: tier1
      via.category: infrastructure
  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_VERSION}
    container_name: ${CONTAINER_PREFIX:-}authentik-worker
    command: worker
    restart: unless-stopped
    mem_limit: 768m
    user: root
    environment:
      AUTHENTIK_POSTGRESQL__HOST: ${CONTAINER_PREFIX:-}authentik-postgres
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - authentik-media:/media
    - authentik-certs:/certs
    - authentik-templates:/templates
    networks:
    - apps
    depends_on:
      authentik-postgres:
        condition: service_healthy
    labels:
      via.service: authentik
      via.role: worker
      via.tier: tier1
volumes:
  authentik-postgres:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/postgres
      o: bind
  authentik-media:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/media
      o: bind
  authentik-templates:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/templates
      o: bind
  authentik-certs:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/certs
      o: bind
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
