services:
  asd-vaultwarden:
    image: ${VAULTWARDEN_IMAGE}
    container_name: ${CONTAINER_PREFIX:-}vaultwarden
    restart: unless-stopped
    mem_limit: 512m
    env_file:
    # ADMIN_TOKEN (an argon2 hash) lives here, outside the project's .env, because
    # Compose would read the $ signs in a hash as variables.
    - ${VIA_APP_DATA_DIR}/secrets.env
    environment:
      TZ: ${TIMEZONE:-UTC}
      DOMAIN: ${VAULTWARDEN_URL:-http://localhost:${VAULTWARDEN_PORT}}
      # Sign-in and sign-up only through Authentik: whoever is in Authentik gets a
      # vault at the first sign-in, nobody else can register. On as soon as a
      # sign-in client is filled in; without one it is a plain Vaultwarden with
      # its own accounts.
      SSO_ENABLED: ${VAULTWARDEN_SSO_CLIENT_ID:+true}
      SSO_ONLY: ${VAULTWARDEN_SSO_CLIENT_ID:+true}
      SIGNUPS_ALLOWED: "true"
      SSO_SIGNUPS_MATCH_EMAIL: "true"
      SSO_AUTHORITY: ${AUTHENTIK_URL:-}/application/o/vaultwarden/
      SSO_CLIENT_ID: ${VAULTWARDEN_SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${VAULTWARDEN_SSO_CLIENT_SECRET:-}
      SSO_SCOPES: "email profile offline_access"
      SSO_PKCE: "true"
      # Inviting people into an organisation is allowed; VAULTWARDEN_ORG_CREATORS says who may make new ones.
      INVITATIONS_ALLOWED: "true"
      ORG_CREATION_USERS: ${VAULTWARDEN_ORG_CREATORS:-}
      SHOW_PASSWORD_HINT: "false"
      PASSWORD_HINTS_ALLOWED: "false"
      SENDS_ALLOWED: "true"
      WEB_VAULT_ENABLED: "true"
      LOG_LEVEL: warn
      # Mail is off until .env holds VAULTWARDEN_SMTP_ENABLED=true and the SMTP settings below.
      _ENABLE_SMTP: ${VAULTWARDEN_SMTP_ENABLED:-false}
      SMTP_HOST: ${MAIL_GATEWAY_SMTP_HOST:-}
      SMTP_PORT: ${MAIL_GATEWAY_SMTP_PORT:-587}
      SMTP_SECURITY: "off"
      SMTP_USERNAME: ${MAIL_GATEWAY_SMTP_USERNAME:-}
      SMTP_PASSWORD: ${VAULTWARDEN_SMTP_PASSWORD:-}
      SMTP_FROM: ${VAULTWARDEN_SMTP_FROM:-}
      SMTP_FROM_NAME: "Vault (viaalink)"
      SMTP_TIMEOUT: "30"
    volumes:
    - vaultwarden-data:/data
    ports:
    - 127.0.0.1:${VAULTWARDEN_PORT}:80
    networks:
    - apps
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:80/alive || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      pma.service: vaultwarden
      pma.role: main
      pma.tier: tier1
volumes:
  vaultwarden-data:
    driver: local
    driver_opts:
      type: none
      device: ${VIA_APP_DATA_DIR}/data
      o: bind
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
