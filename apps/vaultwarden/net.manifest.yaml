id: "${{ macro.concat('env:ENV_PREFIX', 'vaultwarden') }}"
name: Vaultwarden
seedDefaultRegistry: true
endpoint:
  url: "http://127.0.0.1:${{ env.VAULTWARDEN_PORT }}"
caddy:
  publishPreferred: true
  hostRoute:
    host: "vault.${{ macro.tunnelEndpoint() }}"
  # No basic_auth and no edge sign-in: the Bitwarden apps and the bw CLI talk
  # to the API directly and cannot pass a second login.
tunnel:
  public: true
  protocol: http
  port: "${{ env.ASD_CADDY_PORT_HTTP }}"
  subdomain: vault
env:
  VAULTWARDEN_URL: "${{ macro.exposedOrigin() }}"
labels:
  source: package
  priority: "130"
