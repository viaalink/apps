services:
  adminer:
    image: adminer:${ADMINER_VERSION}
    container_name: ${CONTAINER_PREFIX:-}adminer
    restart: unless-stopped
    mem_limit: 256m
    environment:
      TZ: ${TIMEZONE:-UTC}
      # The server the login form starts with: the container name of a database of this
      # project (they share the apps network), for example ${CONTAINER_PREFIX:-}wikijs-postgres.
      ADMINER_DEFAULT_SERVER: ${ADMINER_DEFAULT_SERVER:-}
    ports:
    - 127.0.0.1:${ADMINER_PORT}:8080
    networks:
    - apps
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - -o
      - /dev/null
      - http://127.0.0.1:8080/
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
