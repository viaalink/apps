id: "${{ macro.concat('env:ENV_PREFIX', 'zammad') }}"
name: Zammad
seedDefaultRegistry: true
endpoint:
  url: "http://127.0.0.1:${{ env.ZAMMAD_PORT }}"
caddy:
  publishPreferred: true
  hostRoute:
    host: "${{ macro.hostname('env:ZAMMAD_URL') }}"
  responseHeaders:
    Cache-Control: ["no-store, no-cache, must-revalidate, proxy-revalidate"]
    Pragma: ["no-cache"]
    Expires: ["0"]
  # authPolicy: pma-users
  # authBypassPaths: ["/auth/saml", "/auth/saml/callback", "/auth/openid_connect", "/auth/openid_connect/callback", "/api/v1/integration/*"]
tunnel:
  public: true
  protocol: http
  port: "${{ env.ASD_CADDY_PORT_HTTP }}"
  subdomain: zammad
env:
  ZAMMAD_URL: "${{ macro.exposedOrigin() }}"
labels:
  source: package
  priority: "80"
