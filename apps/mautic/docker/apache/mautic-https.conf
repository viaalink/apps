# Mautic behind a proxy that ends https (the published address): tell PHP the
# request came in over https. Without this Mautic, which knows itself by an
# https address, answers every request with a redirect to that address, forever.
# A request without the proxy's header (http on the local port) stays http.
<IfModule mod_setenvif.c>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
</IfModule>
