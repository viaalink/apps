services:
  mautic-mysql:
    image: mariadb:${MAUTIC_MARIADB_VERSION}
    container_name: ${CONTAINER_PREFIX:-}mautic-mysql
    restart: unless-stopped
    mem_limit: 512m
    environment:
    - MARIADB_ROOT_PASSWORD=${MAUTIC_MYSQL_ROOT_PASSWORD}
    - MARIADB_DATABASE=${MAUTIC_MYSQL_DATABASE}
    - MARIADB_USER=${MAUTIC_MYSQL_USER}
    - MARIADB_PASSWORD=${MAUTIC_MYSQL_PASSWORD}
    volumes:
    - mautic-mysql-data:/var/lib/mysql
    networks:
    - apps
    healthcheck:
      test:
      - CMD-SHELL
      - mariadb-admin --user=$$MARIADB_USER --password=$$MARIADB_PASSWORD ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    labels:
      via.service: mautic
      via.role: database
      via.tier: tier1
  mautic:
    # The image is built from this package: upstream Mautic plus what its SAML sign-in
    # needs to work (see docker/Dockerfile).
    build: &mautic-build
      context: ./docker
      args:
        MAUTIC_VERSION: ${MAUTIC_VERSION}
    image: via-mautic:${MAUTIC_VERSION}
    container_name: ${CONTAINER_PREFIX:-}mautic
    restart: unless-stopped
    mem_limit: 512m
    ports:
    - ${MAUTIC_PORT}:80
    environment:
    - MAUTIC_DB_HOST=${CONTAINER_PREFIX:-}mautic-mysql
    - MAUTIC_DB_PORT=3306
    - MAUTIC_DB_DATABASE=${MAUTIC_MYSQL_DATABASE}
    - MAUTIC_DB_USER=${MAUTIC_MYSQL_USER}
    - MAUTIC_DB_PASSWORD=${MAUTIC_MYSQL_PASSWORD}
    - MAUTIC_MESSENGER_DSN_EMAIL=doctrine://default
    - MAUTIC_MESSENGER_DSN_HIT=doctrine://default
    - TRUSTED_PROXIES=REMOTE_ADDR
    volumes:
    - mautic-config:/var/www/html/config
    - mautic-logs:/var/www/html/var/logs
    - mautic-media-files:/var/www/html/docroot/media/files
    - mautic-media-images:/var/www/html/docroot/media/images
    networks:
    - apps
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost/
      interval: 30s
      timeout: 10s
      retries: 100
      start_period: 60s
    depends_on:
      mautic-mysql:
        condition: service_healthy
    labels:
      via.service: mautic
      via.role: main
      via.tier: tier1
  # Runs Mautic's scheduled jobs (segments, campaigns, sending).
  mautic-cron:
    build: *mautic-build
    image: via-mautic:${MAUTIC_VERSION}
    container_name: ${CONTAINER_PREFIX:-}mautic-cron
    restart: unless-stopped
    mem_limit: 128m
    environment:
    - DOCKER_MAUTIC_ROLE=mautic_cron
    - MAUTIC_DB_HOST=${CONTAINER_PREFIX:-}mautic-mysql
    - MAUTIC_DB_PORT=3306
    - MAUTIC_DB_DATABASE=${MAUTIC_MYSQL_DATABASE}
    - MAUTIC_DB_USER=${MAUTIC_MYSQL_USER}
    - MAUTIC_DB_PASSWORD=${MAUTIC_MYSQL_PASSWORD}
    - MAUTIC_MESSENGER_DSN_EMAIL=doctrine://default
    - MAUTIC_MESSENGER_DSN_HIT=doctrine://default
    volumes:
    - mautic-config:/var/www/html/config
    - mautic-logs:/var/www/html/var/logs
    - mautic-media-files:/var/www/html/docroot/media/files
    - mautic-media-images:/var/www/html/docroot/media/images
    networks:
    - apps
    depends_on:
      mautic:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f 'cron|php' || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      via.service: mautic
      via.role: cron
      via.tier: tier1
  # Works through the queues (mail to send, page hits to store).
  mautic-worker:
    build: *mautic-build
    image: via-mautic:${MAUTIC_VERSION}
    container_name: ${CONTAINER_PREFIX:-}mautic-worker
    restart: unless-stopped
    mem_limit: 512m
    environment:
    - DOCKER_MAUTIC_ROLE=mautic_worker
    - MAUTIC_DB_HOST=${CONTAINER_PREFIX:-}mautic-mysql
    - MAUTIC_DB_PORT=3306
    - MAUTIC_DB_DATABASE=${MAUTIC_MYSQL_DATABASE}
    - MAUTIC_DB_USER=${MAUTIC_MYSQL_USER}
    - MAUTIC_DB_PASSWORD=${MAUTIC_MYSQL_PASSWORD}
    - MAUTIC_MESSENGER_DSN_EMAIL=doctrine://default
    - MAUTIC_MESSENGER_DSN_HIT=doctrine://default
    volumes:
    - mautic-config:/var/www/html/config
    - mautic-logs:/var/www/html/var/logs
    - mautic-media-files:/var/www/html/docroot/media/files
    - mautic-media-images:/var/www/html/docroot/media/images
    networks:
    - apps
    depends_on:
      mautic:
        condition: service_healthy
    healthcheck:
      test:
      - CMD-SHELL
      - pgrep -f 'messenger|worker|php' || exit 1
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      via.service: mautic
      via.role: worker
      via.tier: tier1
# Kept by Docker, not in the data folder: Mautic runs as a user of its own and a running
# install keeps its settings, files and database where they are.
volumes:
  mautic-config:
    driver: local
  mautic-logs:
    driver: local
  mautic-media-files:
    driver: local
  mautic-media-images:
    driver: local
  mautic-mysql-data:
    driver: local
networks:
  apps:
    name: ${VIA_APPS_NETWORK}
    external: true
